<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Human Heart Anatomy 3D & Vascular Flow — Spatial VR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #020612; color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%; height: 100%; display: flex; position: absolute; left: 0; top: 0;
    }
    .viewport {
      flex: 1; height: 100%; position: relative; overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .hud-overlay {
      position: absolute; top: 12px; left: 14px; z-index: 20;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      padding: 12px 16px; border-radius: 14px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      max-width: 320px;
    }
    .hud-title {
      font-size: 1rem; font-weight: 800; color: #F87171; margin-bottom: 4px;
    }
    .hud-sub {
      font-size: 0.76rem; color: #94A3B8; line-height: 1.4;
    }
    .hud-controls {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 20; flex-wrap: wrap; justify-content: center;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      padding: 8px 14px; border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .hud-btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #E2E8F0; padding: 6px 12px; border-radius: 8px;
      font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .hud-btn:hover, .hud-btn.active {
      background: #EF4444; color: #FFF; border-color: #F87171;
    }
    .anatomy-panel {
      position: absolute; top: 12px; right: 14px; z-index: 20;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px);
      padding: 14px 18px; border-radius: 14px;
      border: 1px solid rgba(248, 113, 113, 0.3);
      min-width: 220px; font-size: 0.8rem;
    }
    .vr-split-divider {
      width: 2px; height: 100%; background: #EF4444; z-index: 30; display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container">
    <div id="view-left" class="viewport"><canvas id="c-left"></canvas></div>
    <div id="vr-divider" class="vr-split-divider"></div>
    <div id="view-right" class="viewport" style="display: none;"><canvas id="c-right"></canvas></div>
  </div>

  <div class="hud-overlay">
    <div class="hud-title">❤️ Human Cardiac Anatomy 3D</div>
    <div class="hud-sub">
      កាយវិភាគវិទ្យាបេះដូងមនុស្ស & ចរន្តឈាម Hologram<br>
      Pulsating Muscle &amp; Blood Chamber Flow
    </div>
  </div>

  <div class="anatomy-panel">
    <div style="font-weight: 800; color: #F87171; font-size: 0.95rem; margin-bottom: 6px;" id="chamber-name">Left Ventricle (ថតក្រោមឆ្វេង)</div>
    <div style="color: #94A3B8; line-height: 1.5;" id="chamber-desc">
      Pressure: 120 mmHg (Systolic)<br>
      Function: Pumps oxygen-rich blood to aorta<br>
      Valve: Mitral (Bicuspid) Valve<br>
      Status: <span style="color: #4ADE80; font-weight: 700;">Active Pumping</span>
    </div>
  </div>

  <div class="hud-controls">
    <button class="hud-btn" id="btn-vr">🥽 VR Dual-Eye: OFF</button>
    <button class="hud-btn active" id="btn-bpm-70">72 BPM (Rest)</button>
    <button class="hud-btn" id="btn-bpm-110">110 BPM (Jog)</button>
    <button class="hud-btn" id="btn-bpm-150">150 BPM (Sprint)</button>
    <button class="hud-btn" id="btn-wireframe">Dissection: Solid</button>
  </div>

  <script>
    let isVr = false;
    let bpm = 72;
    let isWireframe = false;
    let scene, rendererLeft, rendererRight, cameraLeft, cameraRight;
    const cLeft = document.getElementById('c-left');
    const cRight = document.getElementById('c-right');
    const viewRight = document.getElementById('view-right');
    const vrDivider = document.getElementById('vr-divider');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060914);

    // Lights
    scene.add(new THREE.AmbientLight(0x475569, 1.4));
    const dirLight1 = new THREE.DirectionalLight(0xFFFFFF, 1.8);
    dirLight1.position.set(20, 40, 30);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0x38BDF8, 0.8);
    dirLight2.position.set(-20, -20, -20);
    scene.add(dirLight2);

    // Heart Group
    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    // Heart Muscle Body (Main Left & Right Ventricles)
    const heartShape = new THREE.Shape();
    const x = 0, y = 0;
    heartShape.moveTo(x + 5, y + 5);
    heartShape.bezierCurveTo(x + 5, y + 5, x + 4, y, x, y);
    heartShape.bezierCurveTo(x - 6, y, x - 6, y + 7, x - 6, y + 7);
    heartShape.bezierCurveTo(x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19);
    heartShape.bezierCurveTo(x + 12, y + 15.4, x + 16, y + 11, x + 16, y + 7);
    heartShape.bezierCurveTo(x + 16, y + 7, x + 16, y, x + 10, y);
    heartShape.bezierCurveTo(x + 7, y, x + 5, y + 5, x + 5, y + 5);

    const extrudeSettings = { depth: 10, bevelEnabled: true, bevelSegments: 6, steps: 4, bevelSize: 4, bevelThickness: 4 };
    const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
    heartGeo.center();

    const heartMat = new THREE.MeshStandardMaterial({
      color: 0xBE123C,
      roughness: 0.35,
      metalness: 0.15,
      wireframe: false
    });
    const heartMesh = new THREE.Mesh(heartGeo, heartMat);
    heartMesh.rotation.z = Math.PI;
    heartMesh.scale.set(1.4, 1.4, 1.4);
    heartGroup.add(heartMesh);

    // Aorta Arch (Top Red Vessel)
    const aortaCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 8, 0),
      new THREE.Vector3(4, 18, 0),
      new THREE.Vector3(-6, 22, -2),
      new THREE.Vector3(-14, 16, -4)
    ]);
    const aortaGeo = new THREE.TubeGeometry(aortaCurve, 24, 3.5, 16, false);
    const aortaMat = new THREE.MeshStandardMaterial({ color: 0xE11D48, roughness: 0.3 });
    const aortaMesh = new THREE.Mesh(aortaGeo, aortaMat);
    heartGroup.add(aortaMesh);

    // Vena Cava (Top Blue Vessel)
    const venaCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-8, 5, 4),
      new THREE.Vector3(-10, 18, 4),
      new THREE.Vector3(-11, 24, 3)
    ]);
    const venaGeo = new THREE.TubeGeometry(venaCurve, 20, 3.0, 16, false);
    const venaMat = new THREE.MeshStandardMaterial({ color: 0x0284C7, roughness: 0.3 });
    const venaMesh = new THREE.Mesh(venaGeo, venaMat);
    heartGroup.add(venaMesh);

    // Pulmonary Artery (Crosses Front)
    const pulmCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-2, 10, 4),
      new THREE.Vector3(2, 14, 2),
      new THREE.Vector3(12, 13, -2)
    ]);
    const pulmGeo = new THREE.TubeGeometry(pulmCurve, 18, 2.8, 16, false);
    const pulmMat = new THREE.MeshStandardMaterial({ color: 0x0EA5E9, roughness: 0.3 });
    const pulmMesh = new THREE.Mesh(pulmGeo, pulmMat);
    heartGroup.add(pulmMesh);

    // Blood Flow Particles (Oxygenated Red & Deoxygenated Blue)
    const particleCount = 200;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    const pColors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      const idx = i * 3;
      pPos[idx] = (Math.random() - 0.5) * 20;
      pPos[idx + 1] = (Math.random() - 0.5) * 30;
      pPos[idx + 2] = (Math.random() - 0.5) * 16;

      // Half Red (Aorta side), Half Blue (Vena Cava side)
      if (i % 2 === 0) {
        pColors[idx] = 1.0; pColors[idx + 1] = 0.2; pColors[idx + 2] = 0.3;
      } else {
        pColors[idx] = 0.1; pColors[idx + 1] = 0.6; pColors[idx + 2] = 1.0;
      }
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
    const pMat = new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.85 });
    const bloodParticles = new THREE.Points(pGeo, pMat);
    heartGroup.add(bloodParticles);

    // Cameras
    cameraLeft = new THREE.PerspectiveCamera(45, 1, 1, 1000);
    cameraRight = new THREE.PerspectiveCamera(45, 1, 1, 1000);

    let camRadius = 75;
    let camTheta = 0.2;
    let camPhi = 1.2;

    function updateCameraPos() {
      const x = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
      const y = camRadius * Math.cos(camPhi);
      const z = camRadius * Math.sin(camPhi) * Math.cos(camTheta);

      cameraLeft.position.set(x, y, z);
      cameraLeft.lookAt(0, 5, 0);

      const ipdOffset = 1.2;
      cameraRight.position.set(x + ipdOffset, y, z);
      cameraRight.lookAt(0, 5, 0);
    }
    updateCameraPos();

    // Renderers
    rendererLeft = new THREE.WebGLRenderer({ canvas: cLeft, antialias: true });
    rendererLeft.setSize(cLeft.clientWidth, cLeft.clientHeight);
    rendererLeft.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    rendererRight = new THREE.WebGLRenderer({ canvas: cRight, antialias: true });
    rendererRight.setSize(cRight.clientWidth, cRight.clientHeight);
    rendererRight.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (isVr) {
        const halfW = w / 2;
        rendererLeft.setSize(halfW, h);
        rendererRight.setSize(halfW, h);
        cameraLeft.aspect = halfW / h;
        cameraRight.aspect = halfW / h;
      } else {
        rendererLeft.setSize(w, h);
        cameraLeft.aspect = w / h;
      }
      cameraLeft.updateProjectionMatrix();
      cameraRight.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);
    onResize();

    // Drag to rotate
    let isDragging = false;
    let prevMouseX = 0, prevMouseY = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.hud-controls') || e.target.closest('.hud-overlay') || e.target.closest('.anatomy-panel')) return;
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      camTheta -= dx * 0.008;
      camPhi = Math.max(0.2, Math.min(Math.PI - 0.2, camPhi - dy * 0.008));
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
      updateCameraPos();
    });

    window.addEventListener('pointerup', () => isDragging = false);
    window.addEventListener('pointercancel', () => isDragging = false);

    window.addEventListener('wheel', (e) => {
      camRadius = Math.max(35, Math.min(130, camRadius + e.deltaY * 0.1));
      updateCameraPos();
    }, { passive: true });

    // VR Toggle
    const btnVr = document.getElementById('btn-vr');
    btnVr.onclick = () => {
      isVr = !isVr;
      if (isVr) {
        viewRight.style.display = 'block';
        vrDivider.style.display = 'block';
        btnVr.textContent = '🥽 VR Dual-Eye: ON';
        btnVr.classList.add('active');
      } else {
        viewRight.style.display = 'none';
        vrDivider.style.display = 'none';
        btnVr.textContent = '🥽 VR Dual-Eye: OFF';
        btnVr.classList.remove('active');
      }
      onResize();
    };

    // BPM Controls
    const b70 = document.getElementById('btn-bpm-70');
    const b110 = document.getElementById('btn-bpm-110');
    const b150 = document.getElementById('btn-bpm-150');

    b70.onclick = () => { bpm = 72; [b70, b110, b150].forEach(b => b.classList.remove('active')); b70.classList.add('active'); };
    b110.onclick = () => { bpm = 110; [b70, b110, b150].forEach(b => b.classList.remove('active')); b110.classList.add('active'); };
    b150.onclick = () => { bpm = 150; [b70, b110, b150].forEach(b => b.classList.remove('active')); b150.classList.add('active'); };

    // Dissection Wireframe Toggle
    const btnWire = document.getElementById('btn-wireframe');
    btnWire.onclick = () => {
      isWireframe = !isWireframe;
      heartMat.wireframe = isWireframe;
      btnWire.textContent = isWireframe ? 'Dissection: Wireframe' : 'Dissection: Solid';
      btnWire.classList.toggle('active', isWireframe);
    };

    // Animation Loop with Realistic Cardiac Pulse
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Double-beat cardiac rhythm (lub-dub)
      const beatFreq = (bpm / 60) * Math.PI * 2;
      const pulsePhase = (time * beatFreq) % (Math.PI * 2);
      let pulseScale = 1.0;

      // Systole contraction (atria then ventricles)
      if (pulsePhase < 0.6) {
        pulseScale = 1.0 + Math.sin(pulsePhase * Math.PI / 0.6) * 0.12;
      } else if (pulsePhase > 0.8 && pulsePhase < 1.4) {
        pulseScale = 1.0 + Math.sin((pulsePhase - 0.8) * Math.PI / 0.6) * 0.08;
      }

      heartMesh.scale.set(1.4 * pulseScale, 1.4 * pulseScale, 1.4 * pulseScale);

      // Slow gentle rotation
      heartGroup.rotation.y = Math.sin(time * 0.3) * 0.25;

      // Move blood flow particles
      const positions = bloodParticles.geometry.attributes.position.array;
      for (let i = 1; i < particleCount * 3; i += 3) {
        positions[i] += (bpm / 72) * 0.35;
        if (positions[i] > 26) positions[i] = -12;
      }
      bloodParticles.geometry.attributes.position.needsUpdate = true;

      rendererLeft.render(scene, cameraLeft);
      if (isVr) {
        rendererRight.render(scene, cameraRight);
      }
    }
    animate();
  </script>
</body>
</html>
